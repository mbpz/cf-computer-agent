<!doctype html><meta charset="utf-8"><title>Local history capability probe</title><h1>Local history capability probe</h1><p>No credentials, network calls or product data.</p><label>Policy <select id="policy"><option>observe</option><option>cancel</option><option>reject-precommit</option><option>defer-precommit</option></select></label><button id="push">Push entry</button><button id="back">Back</button><button id="forward">Forward</button><button id="reject">Reject pending</button><button id="remember">Remember accepted entry</button><button id="restore">Restore accepted key</button><pre id="out"></pre><script>
const out=document.querySelector('#out');let n=0;let reject;let accepted;
function log(x){out.textContent+=JSON.stringify(x)+'\n'}
log({ua:navigator.userAgent,navigation:typeof navigation,intercept:typeof window.NavigateEvent?.prototype.intercept,secure:isSecureContext});
function pos(){return {path:location.pathname,index:window.navigation?.currentEntry?.index,key:window.navigation?.currentEntry?.key}}
document.querySelector('#push').onclick=()=>{history.pushState({probe:++n},'', '/entry-'+n);log({push:pos()})};
document.querySelector('#back').onclick=()=>history.back();document.querySelector('#forward').onclick=()=>history.forward();document.querySelector('#reject').onclick=()=>{reject?.(new Error('Local test cancellation'));reject=null};
document.querySelector('#remember').onclick=()=>{accepted=window.navigation?.currentEntry?.key;log({remember:pos()})};document.querySelector('#restore').onclick=()=>{if(accepted)navigation.traverseTo(accepted).finished.then(()=>log({restored:pos()}),error=>log({restoreError:error.name}))};
window.addEventListener('popstate',()=>log({pop:pos()}));
window.navigation?.addEventListener('navigate',e=>{const policy=document.querySelector('#policy').value;log({navigate:e.navigationType,cancelable:e.cancelable,canIntercept:e.canIntercept,sameDocument:e.destination.sameDocument,destination:e.destination.index,policy,from:pos()});if(e.navigationType!=='traverse')return;if(policy==='cancel'){e.preventDefault();log({prevented:e.defaultPrevented,position:pos()})}else if(policy.endsWith('precommit'))try{e.intercept({precommitHandler:()=>{log({precommit:pos()});if(policy==='reject-precommit')return Promise.reject(new Error('Local test rejection'));return new Promise((_,no)=>{reject=no})},handler:()=>log({handler:pos()})})}catch(error){log({error:error.name,message:error.message})}});
window.navigation?.addEventListener('currententrychange',()=>log({entrychange:pos()}));window.navigation?.addEventListener('navigateerror',e=>log({navigateerror:e.message,position:pos()}));
</script>
