<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机连接准入探针</title></head>
<body><main><h1>本机连接准入探针</h1><p>仅验证握手，不转发外网流量，不运行 Linux，不代表 VM 已联网。</p>
<p>确认启动时指定的 HTTPS 来源是你要测试的页面。生成的配对码仅在本页显示 30 秒；新码使旧码失效。不要分享或截图保存。</p>
<button id="issue" type="button">生成一次性配对码</button><button id="clear" type="button">清除显示</button>
<p id="status" role="status"></p><output id="token" aria-label="一次性配对码"></output>
<p>将配对码粘贴到已获准发布的 HTTPS 探针页。关闭终端中的连接器会停止所有握手会话。</p></main><script type="module" src="./control.mjs"></script></body></html>
