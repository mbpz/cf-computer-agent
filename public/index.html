<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Memory Garden</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app-shell" class="app-shell" data-ready="false">
      <aside id="sidebar" class="sidebar" aria-label="工作区导航">
        <div class="brand">
          <span class="eyebrow">PRIVATE KNOWLEDGE WORKSPACE</span>
          <a href="/" data-route class="brand-name">Memory Garden</a>
        </div>
        <nav id="primary-navigation" aria-label="主要导航"></nav>
        <div class="sidebar-footer">
          <button id="logout-button" class="logout-button" type="button" hidden>退出工作区</button>
        </div>
      </aside>
      <div class="app-frame">
        <header class="topbar">
          <button id="drawer-toggle" class="icon-button" type="button" aria-expanded="false" aria-controls="sidebar">Open navigation</button>
          <div id="session-summary" class="session-summary" aria-live="polite">正在确认登录状态…</div>
        </header>
        <main id="main-content" tabindex="-1">
          <div id="status-region" class="status-region" aria-live="polite"></div>
          <div id="page-outlet" aria-live="polite" aria-busy="true" tabindex="-1">
            <section class="page-state" aria-labelledby="loading-title">
              <p class="eyebrow">MEMORY GARDEN</p>
              <h1 id="loading-title">正在加载工作区</h1>
              <p>正在确认当前登录状态，再加载页面内容。</p>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="/vendor/markdown-it.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
